spring:
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/itam_test}
    driver-class-name: org.postgresql.Driver
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD:123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: WARN
    com.company.itam: DEBUG
