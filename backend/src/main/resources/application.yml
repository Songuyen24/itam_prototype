spring:
  application:
    name: itam-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  mail:
    host: 127.0.0.1
    port: 1025
    default-encoding: UTF-8
    properties:
      "mail.smtp.auth": false
      "mail.smtp.starttls.enable": false
      "mail.smtp.connectiontimeout": 5000
      "mail.smtp.timeout": 5000
      "mail.smtp.writetimeout": 5000

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itam_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.company.itam: DEBUG

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-signing-must-be-at-least-32-characters-long}
  access-token-ttl: 86400000   # 24 hours in milliseconds

itam:
  ocr:
    executable: ${ITAM_OCR_EXECUTABLE:tesseract}
    languages: ${ITAM_OCR_LANGUAGES:eng+vie}
  email:
    mode: ${ITAM_EMAIL_MODE:simulated}
    from: itam@itam.example
  disposal:
    minimum-age-years: ${DISPOSAL_MINIMUM_AGE_YEARS:5}
  publication:
    disposal-purchasing-recipient: ${DISPOSAL_PURCHASING_RECIPIENT:pur@itam.example}
    disposal-accounting-recipient: ${DISPOSAL_ACCOUNTING_RECIPIENT:accounting@itam.example}
  documents:
    storage-root: ${DOCUMENT_STORAGE_ROOT:../storage}
    max-file-size: 10485760
