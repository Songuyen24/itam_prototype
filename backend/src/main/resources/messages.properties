# System & General Errors (Fallback)
INTERNAL_SERVER_ERROR=Đã xảy ra lỗi hệ thống. Vui lòng thử lại sau.
VALIDATION_ERROR=Dữ liệu không hợp lệ
RESOURCE_NOT_FOUND=Không tìm thấy tài nguyên yêu cầu
DATA_INTEGRITY_ERROR=Ràng buộc toàn vẹn dữ liệu bị vi phạm
UNAUTHORIZED=Không xác định được người dùng thực hiện hoặc chưa đăng nhập
ACCESS_DENIED=Bạn không có quyền thực hiện thao tác này

# Catalog Errors
CATALOG_IN_USE=Danh mục đang được sử dụng trong hệ thống, không thể xóa
DUPLICATE_CODE=Dữ liệu đã tồn tại trong hệ thống

# Asset Errors
DUPLICATE_ASSET_TAG=Mã tài sản đã tồn tại trong hệ thống
DUPLICATE_SERIAL_NUMBER=Số Serial Number đã tồn tại trong hệ thống
INVALID_ASSIGNMENT=Tài sản ở trạng thái này không được gán người sử dụng
ASSIGNMENT_REQUIRED=Tài sản ở trạng thái IN_USE bắt buộc phải có người sử dụng

# Excel Import Errors
NO_DATA_TO_IMPORT=Danh sách dữ liệu cần import không được để trống
NO_VALID_ROWS=Không có dòng dữ liệu hợp lệ nào để import sau khi kiểm tra lại
TEMPLATE_GENERATION_FAILED=Không thể tạo file template Excel
EMPTY_EXCEL_FILE=File Excel không có trang tính nào
EMPTY_DATA=File Excel không chứa dữ liệu dòng nào
EXCEEDS_MAX_ROWS=Số lượng dòng dữ liệu vượt quá giới hạn 1,000 dòng
INVALID_EXCEL_FORMAT=Không thể đọc định dạng file Excel
FILE_EMPTY=File tải lên không được để trống
FILE_TOO_LARGE=Dung lượng file vượt quá giới hạn 10MB
INVALID_FILE_TYPE=Chỉ chấp nhận định dạng file Excel (.xlsx hoặc .xls)

# Documents and transaction references
DOCUMENT_LIST_SUCCESS=Lấy danh sách chứng từ thành công
DOCUMENT_GET_SUCCESS=Lấy thông tin chứng từ thành công
DOCUMENT_NOT_FOUND=Không tìm thấy chứng từ
DOCUMENT_REQUEST_INVALID=Yêu cầu chứng từ không hợp lệ; ID phải dương và kích thước trang từ 1 đến 100
DOCUMENT_WORKFLOW_NOT_READY=Chức năng thay đổi chứng từ chưa khả dụng. Phiếu hiện chỉ cho phép đọc.
DOCUMENT_LOCKED=Không được thay đổi chứng từ đã khóa, đã phát hành hoặc thuộc lịch sử
DOCUMENT_FILE_INVALID=File chứng từ không hợp lệ. Chỉ chấp nhận PDF, PNG hoặc JPEG có nội dung đúng định dạng
DOCUMENT_FILE_TOO_LARGE=Dung lượng chứng từ vượt giới hạn cho phép
DOCUMENT_STORAGE_ERROR=Không thể lưu hoặc đọc chứng từ
DOCUMENT_FILE_NOT_FOUND=Không tìm thấy file chứng từ trong kho lưu trữ
DOCUMENT_FILE_CORRUPT=File chứng từ không khớp thông tin đã lưu
DOCUMENT_PATH_INVALID=Đường dẫn lưu trữ chứng từ không hợp lệ
TRANSACTION_LIST_SUCCESS=Lấy danh sách phiếu thành công
TRANSACTION_GET_SUCCESS=Lấy thông tin phiếu thành công
TRANSACTION_NOT_FOUND=Không tìm thấy phiếu
