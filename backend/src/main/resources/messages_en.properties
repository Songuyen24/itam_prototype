# System & General Errors
INTERNAL_SERVER_ERROR=An unexpected system error occurred. Please try again later.
VALIDATION_ERROR=Invalid data provided
RESOURCE_NOT_FOUND=Requested resource not found
DATA_INTEGRITY_ERROR=Data integrity constraint violation
UNAUTHORIZED=Unauthorized or user session not identified
ACCESS_DENIED=Access denied. You do not have permission to perform this action

# Catalog Errors
CATALOG_IN_USE=Catalog item is currently in use in the system and cannot be deleted
DUPLICATE_CODE=Code or record already exists in the system

# Asset Errors
DUPLICATE_ASSET_TAG=Asset tag already exists in the system
DUPLICATE_SERIAL_NUMBER=Serial number already exists in the system
INVALID_ASSIGNMENT=Asset in this status cannot be assigned to a user
ASSIGNMENT_REQUIRED=Asset in IN_USE status must be assigned to a user

# Excel Import Errors
NO_DATA_TO_IMPORT=Import data list cannot be empty
NO_VALID_ROWS=No valid rows found to import after re-validation
TEMPLATE_GENERATION_FAILED=Failed to generate Excel template file
EMPTY_EXCEL_FILE=Excel file contains no worksheets
EMPTY_DATA=Excel file contains no data rows
EXCEEDS_MAX_ROWS=Number of data rows exceeds maximum limit of 1,000 rows
INVALID_EXCEL_FORMAT=Cannot read Excel file format
FILE_EMPTY=Uploaded file cannot be empty
FILE_TOO_LARGE=File size exceeds 10MB limit
INVALID_FILE_TYPE=Only Excel file formats (.xlsx or .xls) are accepted

# Auth & Login Errors
LOGIN_INVALID_CREDENTIALS=Invalid email or password
LOGIN_ACCOUNT_LOCKED=Account has been locked. Please contact the administrator
LOGIN_ACCOUNT_DISABLED=Account has been disabled
TOKEN_EXPIRED=Session expired, please log in again
TOKEN_INVALID=Invalid authentication token

# Auth & Login Success
LOGIN_SUCCESS=Login successful
LOGOUT_SUCCESS=Logout successful
CURRENT_USER_SUCCESS=Current user fetched successfully
USER_LIST_SUCCESS=User list fetched successfully
USER_GET_SUCCESS=User fetched successfully
MY_ASSETS_SUCCESS=My assets fetched successfully

# Documents and transaction references
DOCUMENT_LIST_SUCCESS=Documents fetched successfully
DOCUMENT_GET_SUCCESS=Document fetched successfully
DOCUMENT_NOT_FOUND=Document not found
DOCUMENT_REQUEST_INVALID=Invalid document request; IDs must be positive and page size must be between 1 and 100
DOCUMENT_WORKFLOW_NOT_READY=Document changes are not available. This transaction is read-only.
DOCUMENT_LOCKED=Locked, issued or historical documents cannot be changed
DOCUMENT_FILE_INVALID=Invalid document file. Only PDF, PNG or JPEG files with matching content are accepted
DOCUMENT_FILE_TOO_LARGE=Document size exceeds the allowed limit
DOCUMENT_STORAGE_ERROR=Unable to store or read the document
DOCUMENT_FILE_NOT_FOUND=Document file was not found in storage
DOCUMENT_FILE_CORRUPT=Document file does not match its saved metadata
DOCUMENT_PATH_INVALID=Invalid document storage path
TRANSACTION_LIST_SUCCESS=Transactions fetched successfully
TRANSACTION_GET_SUCCESS=Transaction fetched successfully
TRANSACTION_NOT_FOUND=Transaction not found
TRANSACTION_REQUEST_INVALID=Invalid transaction request; IDs must be positive, page size must be between 1 and 100 and the keyword must not exceed 100 characters
